name: Frontend
on:
  push:
    paths: ['frontend/**', 'contracts/openapi.json', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['frontend/**', 'contracts/openapi.json', '.github/workflows/frontend.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run generate:api
      - run: git diff --exit-code -- lib/backend-schema.d.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
