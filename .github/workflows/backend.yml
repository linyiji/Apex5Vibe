name: Backend
on:
  push:
    paths-ignore: ['frontend/**']
  pull_request:
    paths-ignore: ['frontend/**']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: ruff check backend scripts
      - run: ruff format --check backend scripts
      - run: pytest
      - run: python scripts/export_openapi.py --check
